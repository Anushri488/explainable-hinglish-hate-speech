experiment_name: muril_stage1_hatexplain_rationale
seed: 42
output_dir: results/muril_stage1_hatexplain_rationale
init_checkpoint: null

data:
  dataset: hatexplain
  dataset_path: data/raw/hatexplain/dataset.json
  divisions_path: data/raw/hatexplain/post_id_divisions.json
  lowercase: true

model:
  type: transformer
  pretrained_name: google/muril-base-cased
  max_length: 128
  dropout: 0.1
  num_labels: 2

training:
  batch_size: 16
  epochs: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1

rationale:
  lambda: 1.0   # 0 = no rationale supervision; try 0.1, 1, 10, 100
